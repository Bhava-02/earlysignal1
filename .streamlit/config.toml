[server]
headless = true
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#b3163a"
backgroundColor = "#f6f7fb"
secondaryBackgroundColor = "#f1f2f6"
textColor = "#1d2433"
font = "sans serif"

[client]
toolbarMode = "minimal"
